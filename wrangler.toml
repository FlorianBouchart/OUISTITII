# ═══════════════════════════════════════════════════════════════
# OUISTITII par T&F — Cloudflare Worker (API + front statique)
# ═══════════════════════════════════════════════════════════════
name = "ouistitii"
main = "worker/index.js"
compatibility_date = "2026-01-15"
workers_dev = true

# Le Worker sert aussi le front : un seul domaine, aucun CORS entre l'app et l'API.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Stockage des médias — bucket PRIVÉ (aucun accès public).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ouistitii-medias"
preview_bucket_name = "ouistitii-medias-dev"

# Métadonnées (contributeurs, médias, statuts).
[[d1_databases]]
binding = "DB"
database_name = "ouistitii"
database_id = "REMPLACER_PAR_L_ID_D1"

[vars]
EVENT_DATE   = "2026-12-12"
EVENT_PREFIX = "mariage"
# Taille max par fichier (Mo). Une vidéo 4K d'une minute pèse ~350 Mo.
MAX_FILE_MB  = "600"
# Au-delà de ce seuil (Mo) on bascule en upload multipart repranable.
MULTIPART_THRESHOLD_MB = "8"
PART_SIZE_MB = "8"
# Date de fin de mise à disposition, ANNONCÉE aux invités dans l'album.
# Laissée vide : rien n'expire, rien n'est supprimé automatiquement, et le
# stockage n'a pas d'échéance. À ne remplir que si les mariés décident un jour
# de fermer l'album — auquel cas la date s'affichera d'elle-même.
AVAILABLE_UNTIL = ""

# ═══ LE VERROU ═══════════════════════════════════════════════════
# Plafond de stockage, en gigaoctets. Au-delà, l'application REFUSE tout
# nouvel envoi : l'album reste consultable et téléchargeable, mais plus rien
# n'entre. C'est ce qui garantit qu'aucune facture ne peut apparaître.
#
# Réglé sous les 15 Go offerts par Google Drive, avec une marge : une vidéo
# peut peser plusieurs centaines de mégaoctets, et le dernier envoi ne doit
# jamais faire basculer le compte au-delà du gratuit.
STORAGE_LIMIT_GB = "13.5"

# Où atterrissent les souvenirs, si le dossier ne doit pas être à la racine
# du Drive. Laisser vide pour la racine.
GOOGLE_FOLDER_ID = ""

# Secrets à définir avec `npx wrangler secret put <NOM>` — jamais dans ce fichier.
#
# Pour le Google Drive des mariés (option retenue, 15 Go offerts, 0 €) :
#   GOOGLE_CLIENT_ID       — identifiant OAuth du projet Google
#   GOOGLE_CLIENT_SECRET   — secret associé
#   GOOGLE_REFRESH_TOKEN   — jeton de renouvellement obtenu une seule fois
#
# Pour un stockage objet compatible S3 (autre option, payante au-delà de 10 Go) :
#   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY / S3_ENDPOINT
#
# Dans tous les cas :
#   TOKEN_SECRET           — chaîne aléatoire (signature des jetons invité)
#   ADMIN_PASSWORD         — mot de passe de l'espace des mariés
