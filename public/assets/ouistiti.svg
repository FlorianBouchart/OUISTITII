<!--
  La mascotte OUISTITII — un ouistiti à pinceaux au trait, dans l'esprit des
  gravures de la toile de Jouy. Le sourire est le motif central : « ouistiti »,
  c'est le mot qu'on dit pour sourire sur les photos.
  La couleur suit `currentColor` : inliner le SVG plutôt que l'appeler en <img>.
  Classes utiles à l'animation : .oui-tail, .oui-tuft, .oui-smile, .oui-eye.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 152" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Queue annelée, calculée en spirale : c'est elle qui signe la marque -->
  <g class="oui-tail">
