<!--
  OUISTITII — la mascotte.
  Construite en aplats et en arcs : formes pleines, courbes franches, aucune
  ligne tremblante. Lisible de 24 px dans une barre à 200 px sur l'accueil.

  Deux variables CSS permettent de la poser sur clair comme sur sombre :
  « oui-fur » pour le pelage (currentColor par défaut) et « oui-face » pour le
  masque clair du museau (le crème de la charte par défaut).
  Attention : un commentaire XML n'accepte pas deux tirets d'affilée.
-->
