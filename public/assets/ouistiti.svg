        <path d="M96.9 102.8L104.6 107.8" stroke-width="1.5" opacity=".6"/>
    <path d="M124.9 89.4L124.0 97.8" stroke-width="1.5" opacity=".6"/>
    <path d="M146.1 107.8L138.7 109.6" stroke-width="1.5" opacity=".6"/>
    <path d="M139.6 127.8L135.2 122.6" stroke-width="1.5" opacity=".6"/>
    <path d="M119.2 128.7L122.7 123.9" stroke-width="1.5" opacity=".6"/>
    <path d="M114.5 114.3L119.3 115.8" stroke-width="1.5" opacity=".6"/>
  </g>

  <!-- Épaules -->
  <path d="M43 140c1-16 11-27 27-27s26 11 27 27" stroke-width="2.2"/>

  <!-- Touffes d'oreilles : la signature du ouistiti -->
  <g class="oui-tuft oui-tuft-l">
    <path d="M40 48c-8-5-12-13-11-22"/>
    <path d="M38 55c-9-2-16-8-18-17"/>
    <path d="M37.5 62c-10 1-17-3-21-11"/>
    <path d="M39 69c-9 4-17 3-22-3"/>
  </g>
  <g class="oui-tuft oui-tuft-r">
    <path d="M100 48c8-5 12-13 11-22"/>
    <path d="M102 55c9-2 16-8 18-17"/>
    <path d="M102.5 62c10 1 17-3 21-11"/>
    <path d="M101 69c9 4 17 3 22-3"/>
  </g>

  <!-- Tête -->
  <path d="M70 26c18 0 31 15 31 34 0 20-13 34-31 34s-31-14-31-34c0-19 13-34 31-34z"
        stroke-width="2.3"/>

  <!-- Toupet frontal -->
  <path d="M62 31c2.5-4.5 5-7 8-8 3 1 5.5 3.5 8 8" stroke-width="1.6" opacity=".85"/>

  <!-- Yeux grands ouverts -->
  <g class="oui-eyes">
    <circle class="oui-eye" cx="57" cy="56" r="7.4" stroke-width="2"/>
    <circle class="oui-eye" cx="83" cy="56" r="7.4" stroke-width="2"/>
    <circle cx="57.8" cy="55.4" r="3.2" fill="currentColor" stroke="none"/>
    <circle cx="83.8" cy="55.4" r="3.2" fill="currentColor" stroke="none"/>
    <circle cx="59.6" cy="53.4" r="1.05" fill="#FAF5EF" stroke="none"/>
    <circle cx="85.6" cy="53.4" r="1.05" fill="#FAF5EF" stroke="none"/>
  </g>

  <!-- Nez -->
  <path d="M67.2 70.5c.9-1.2 4.7-1.2 5.6 0 .8 1.1-.5 2.4-2.8 2.4s-3.6-1.3-2.8-2.4z"
        fill="currentColor" stroke="none"/>

  <!-- Le sourire : large, franc, commissures relevées -->
  <path class="oui-smile" d="M55.5 76.5c2.6 7.4 8 11.1 14.5 11.1s11.9-3.7 14.5-11.1"
        stroke-width="2.4"/>
  <path d="M55.5 76.5c-.6-1.6-.8-2.9-.6-4" stroke-width="1.6" opacity=".6"/>
  <path d="M84.5 76.5c.6-1.6.8-2.9.6-4" stroke-width="1.6" opacity=".6"/>
</svg>
